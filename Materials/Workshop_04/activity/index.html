  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Interactive Check Explainer</title>
      <link rel="stylesheet" href="../../_assets/materials.css" />
      <style>
        :root {
          --hotspot-size: 46px;
        }

        body {
          max-width: 1100px;
          margin: 0 auto;
          padding: 18px;
        }

        .wrap {
          display: grid;
          gap: 14px;
        }

        .topbar {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
          justify-content: space-between;
        }

        .topbar nav {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          align-items: center;
        }

        .btn {
          display: inline-block;
          padding: 10px 14px;
          border-radius: 10px;
          border: 1px solid rgba(0,0,0,0.25);
          text-decoration: none;
          background: white;
          color: inherit;
        }

        .btn:hover {
          filter: brightness(0.98);
        }

        .card {
          background: white;
          border: 1px solid rgba(0,0,0,0.18);
          border-radius: 14px;
          padding: 14px;
          box-shadow: 0 6px 24px rgba(0,0,0,0.06);
        }

        .hint {
          margin: 0;
          opacity: 0.85;
        }

        .stage {
          position: relative;
          width: 100%;
          max-width: 1100px;
          margin: 0 auto;
          border-radius: 14px;
          overflow: hidden;
          border: 1px solid rgba(0,0,0,0.18);
          background: #fff;
        }

        .stage img {
          display: block;
          width: 100%;
          height: auto;
        }

        .hotspot {
          position: absolute;
          width: var(--hotspot-size);
          height: var(--hotspot-size);
          border-radius: 999px;
          transform: translate(-50%, -50%);
          border: 2px solid rgba(0,0,0,0.75);
          background: rgba(255,255,255,0.90);
          display: grid;
          place-items: center;
          cursor: pointer;
          user-select: none;
        }

        .hotspot:focus {
          outline: 3px solid rgba(0, 95, 204, 0.9);
          outline-offset: 2px;
        }

        .hotspot span {
          font-weight: 800;
          font-size: 16px;
          line-height: 1;
        }

        /* Modal */
        .modal-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.55);
          display: none;
          align-items: center;
          justify-content: center;
          padding: 18px;
          z-index: 9999;
        }

        .modal {
          width: min(720px, 100%);
          background: #fff;
          border-radius: 16px;
          border: 1px solid rgba(0,0,0,0.2);
          box-shadow: 0 16px 60px rgba(0,0,0,0.25);
          overflow: hidden;
        }

        .modal header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 16px;
          border-bottom: 1px solid rgba(0,0,0,0.12);
        }

        .modal header h2 {
          margin: 0;
          font-size: 18px;
        }

        .modal .body {
          padding: 16px;
        }

        .modal .body p {
          margin-top: 0;
          margin-bottom: 0;
          line-height: 1.5;
        }

        .close {
          border: 1px solid rgba(0,0,0,0.25);
          background: white;
          border-radius: 10px;
          padding: 8px 10px;
          cursor: pointer;
        }
      </style>
    </head>

    <body>
      <div class="wrap">
        <div class="topbar">
          <div>
            <h1 style="margin:0;">Interactive Check Explainer</h1>
            <p class="hint" style="margin-top:6px;">
              Click a number on the check to learn what it means.
            </p>
          </div>

          <nav>
            <a class="btn" href="../../index.html">Home</a>
            <a class="btn" href="../index.html">Back to Workshop 4</a>
          </nav>
        </div>

        <div class="card">
          <p class="hint">
            Tip: You can also use the <strong>Tab</strong> key to move through numbers, then press <strong>Enter</strong>.
          </p>
        </div>

        <div class="stage" id="stage">
          <img
            src="../../_assets/images/check-how-to-read.png"
            alt="A sample check with numbered callouts."
          />
          <!-- Hotspots injected by JS -->
        </div>
      </div>

      <!-- Modal -->
      <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
          <header>
            <h2 id="modalTitle">Item</h2>
            <button class="close" id="closeBtn" type="button" aria-label="Close">Close</button>
          </header>
          <div class="body">
            <p id="modalText"></p>
          </div>
        </div>
      </div>

      <script>
        /**
        * Hotspot positions are based on the cropped check image produced from pg11_12.pdf.
        * Positions are percentages of the image dimensions.
        */
        const HOTSPOTS = [
          { num: 1, xPct: 19.5783, yPct: 18.2353 },
          { num: 2, xPct: 62.1084, yPct: 18.9412 },
          { num: 3, xPct: 70.1807, yPct: 18.9412 },
          { num: 4, xPct: 25.8434, yPct: 25.2941 },
          { num: 5, xPct: 10.3012, yPct: 28.5882 },
          { num: 6, xPct: 19.5783, yPct: 30.4706 },
          { num: 7, xPct: 7.4096,  yPct: 43.1765 },
          { num: 8, xPct: 9.6988,  yPct: 80.5882 },
          { num: 9, xPct: 20.4217, yPct: 80.5882 },
          { num: 10, xPct: 28.8554, yPct: 80.8235 },
          { num: 11, xPct: 39.2169, yPct: 86.7059 },
          { num: 12, xPct: 48.1325, yPct: 86.9412 },
        ];

        /**
        * Explanations (you can edit text freely later without touching coordinates).
        * Kept simple + practical; no repo restructuring required.
        */
        const EXPLAIN = {
          1: {
            title: "1. Date",
            text: "The date the check is written (month/day/year)."
          },
          2: {
            title: "2. Pay to the Order of",
            text: "Who the check is being paid to (a person or an organization)."
          },
          3: {
            title: "3. Amount (Numbers)",
            text: "The payment amount written in numbers. This should match the written amount."
          },
          4: {
            title: "4. Amount (Words)",
            text: "The payment amount written out in words. If there’s ever a mismatch, banks typically rely on the written amount."
          },
          5: {
            title: "5. Memo / For",
            text: "Optional note describing what the payment is for (rent, utilities, invoice #, etc.)."
          },
          6: {
            title: "6. Signature",
            text: "The payer’s signature. Without it, the check is usually not valid."
          },
          7: {
            title: "7. Your Information / Bank Information",
            text: "Typically includes the payer’s name/address and/or bank name (format varies by check design)."
          },
          8: {
            title: "8. Routing Number",
            text: "Identifies the bank. This is the first set of numbers in the MICR line at the bottom."
          },
          9: {
            title: "9. Account Number",
            text: "Identifies the specific bank account the money comes from (second set in the MICR line)."
          },
          10: {
            title: "10. Check Number (MICR / Header)",
            text: "The check’s ID number. Often appears at the top and again at the bottom (format varies)."
          },
          11: {
            title: "11. Check Number (Top Corner)",
            text: "Another location where the check number may appear for easier reference."
          },
          12: {
            title: "12. MICR Line (Bottom Line)",
            text: "The machine-readable line that contains routing/account/check-number information for processing."
          }
        };

        const stage = document.getElementById("stage");
        const backdrop = document.getElementById("backdrop");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const closeBtn = document.getElementById("closeBtn");

        function openModal(n) {
          const info = EXPLAIN[n] || { title: `Item ${n}`, text: "" };
          modalTitle.textContent = info.title;
          modalText.textContent = info.text;
          backdrop.style.display = "flex";
          closeBtn.focus();
        }

        function closeModal() {
          backdrop.style.display = "none";
        }

        function buildHotspots() {
          HOTSPOTS.forEach(h => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "hotspot";
            btn.style.left = `${h.xPct}%`;
            btn.style.top = `${h.yPct}%`;
            btn.setAttribute("aria-label", `Open explanation for number ${h.num}`);
            btn.innerHTML = `<span>${h.num}</span>`;
            btn.addEventListener("click", () => openModal(h.num));
            stage.appendChild(btn);
          });
        }

        // Close interactions
        closeBtn.addEventListener("click", closeModal);
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeModal();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && backdrop.style.display === "flex") closeModal();
        });

        buildHotspots();
      </script>
    </body>
  </html>
