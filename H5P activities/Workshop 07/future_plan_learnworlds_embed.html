
<div class="mb-page-tools" aria-label="Activity tools">
  <button type="button" data-mb-page-download>Download</button>
  <button type="button" data-mb-page-print>Print</button>
</div>
<script id="mb-page-tools-script">
(function(){
  function textValue(el){
    if(!el) return '';
    if(el.type === 'checkbox' || el.type === 'radio') return el.checked ? 'Yes' : '';
    return (el.value || '').trim();
  }
  function labelFor(el){
    if(!el) return 'Response';
    if(el.id){
      var label = document.querySelector('label[for="' + CSS.escape(el.id) + '"]');
      if(label && label.textContent.trim()) return label.textContent.trim();
    }
    return el.getAttribute('aria-label') || el.placeholder || el.name || 'Response';
  }
  function downloadResponses(){
    var title = (document.querySelector('h1,h2,[data-title]') || document).textContent.trim().replace(/\s+/g,' ') || document.title || 'Activity responses';
    var lines = [title, ''];
    Array.prototype.forEach.call(document.querySelectorAll('input, textarea, select'), function(el){
      if(el.type === 'hidden' || el.closest('.mb-page-tools')) return;
      var value = textValue(el);
      if(value) lines.push(labelFor(el) + ':', value, '');
    });
    if(lines.length === 2) lines.push('No responses entered yet.');
    var blob = new Blob([lines.join('\n')], {type:'text/plain'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'activity-responses') + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();}, 0);
  }
  document.addEventListener('click', function(event){
    if(event.target.matches('[data-mb-page-download]')) downloadResponses();
    if(event.target.matches('[data-mb-page-print]')) window.print();
  });
})();
</script>

<style id="mb-page-tools-style">
  .mb-page-tools{display:flex;gap:8px;align-items:center;margin:12px auto 14px;max-width:960px;padding:0 16px;font-family:Arial,Helvetica,sans-serif}
  .mb-page-tools button{appearance:none;border:0;border-radius:6px;background:#164e63;color:#fff;font:700 14px/1 Arial,Helvetica,sans-serif;padding:10px 14px;cursor:pointer}
  .mb-page-tools button:hover{background:#0f3f50}
  .mb-page-tools button:focus{outline:3px solid #facc15;outline-offset:2px}
  @media print{.mb-page-tools{display:none!important}}
</style>

<style>
  .mb7future-wrap{max-width:860px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}

  .mb7future-copy{margin:0 0 10px;color:rgb(0,0,0)}

  .mb7future-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .mb7future-tool{padding:9px 14px;border:1px solid #094725;border-radius:999px;background:#094725;color:#ffffff;font:inherit;font-weight:700;line-height:1.1;cursor:pointer}

  .mb7future-tool:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}

  .mb7future-input{display:block;width:100%;min-height:42px;padding:10px 12px;border:2px solid #000000;border-radius:14px;background:transparent;color:rgb(0,0,0);font:inherit;line-height:1.2}
  .mb7future-input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}

  @media (max-width:640px){

<div id="mb7future-root" class="mb7future-wrap">
  <div class="mb7future-shell">
    <section class="mb7future-header">
      <h2 class="mb7future-title">Planning for the Future</h2>
      <p class="mb7future-copy">Think in hopeful numbers and realistic numbers.</p>
      <p class="mb7future-copy">Use the spaces below to write down debt-reduction goals that feel meaningful to you now.</p>
      <div class="mb7future-tools" aria-label="Activity tools">
        <button class="mb7future-tool" type="button" data-mb7future-download>Download</button>
        <button class="mb7future-tool" type="button" data-mb7future-print>Print</button>
      </div>
    </section>

    <div class="mb7future-body">
      <section class="mb7future-panel">
        <div class="mb7future-prompt">
          <label class="mb7future-label" for="mb7future-one-year-hopeful">One year from now, I would like to reduce my debt by:</label>
          <div class="mb7future-money">
            <span class="mb7future-dollar" aria-hidden="true">$</span>
            <input id="mb7future-one-year-hopeful" class="mb7future-input" type="text" inputmode="decimal" autocomplete="off" aria-label="One year from now, I would like to reduce my debt by">
          </div>
        </div>
      </section>

      <section class="mb7future-panel">
        <div class="mb7future-prompt">
          <label class="mb7future-label" for="mb7future-one-year-realistic">One year from now, I realistically think I can reduce my debt by:</label>
          <div class="mb7future-money">
            <span class="mb7future-dollar" aria-hidden="true">$</span>
            <input id="mb7future-one-year-realistic" class="mb7future-input" type="text" inputmode="decimal" autocomplete="off" aria-label="One year from now, I realistically think I can reduce my debt by">
          </div>
        </div>
      </section>

      <section class="mb7future-panel">
        <div class="mb7future-prompt">
          <label class="mb7future-label" for="mb7future-three-year-hopeful">Three years from now, I would like to reduce my debt by:</label>
          <div class="mb7future-money">
            <span class="mb7future-dollar" aria-hidden="true">$</span>
            <input id="mb7future-three-year-hopeful" class="mb7future-input" type="text" inputmode="decimal" autocomplete="off" aria-label="Three years from now, I would like to reduce my debt by">
          </div>
        </div>
      </section>

      <section class="mb7future-panel">
        <div class="mb7future-prompt">
          <label class="mb7future-label" for="mb7future-three-year-realistic">Three years from now, I realistically think I can reduce my debt by:</label>
          <div class="mb7future-money">
            <span class="mb7future-dollar" aria-hidden="true">$</span>
            <input id="mb7future-three-year-realistic" class="mb7future-input" type="text" inputmode="decimal" autocomplete="off" aria-label="Three years from now, I realistically think I can reduce my debt by">
          </div>
        </div>
      </section>

      <section class="mb7future-panel">
        <p class="mb7future-note">Your answers here can help you decide which debts to focus on first.</p>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb7future-root');
  var inputs = Array.prototype.slice.call(root ? root.querySelectorAll('.mb7future-input') : []);
  var downloadButton = root ? root.querySelector('[data-mb7future-download]') : null;
  var printButton = root ? root.querySelector('[data-mb7future-print]') : null;

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb7future',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  inputs.forEach(function (input) {
    input.addEventListener('input', postHeight);
  });

  function downloadText(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function collectResponses() {
    var lines = ['Planning for the Future', ''];
    inputs.forEach(function (input) {
      var label = root.querySelector('label[for="' + input.id + '"]');
      lines.push((label ? label.textContent : input.getAttribute('aria-label')) + ' $' + input.value);
    });
    return lines.join('\n');
  }

  if (downloadButton) {
    downloadButton.addEventListener('click', function () {
      downloadText('future-action-plan.txt', collectResponses());
    });
  }

  if (printButton) {
    printButton.addEventListener('click', function () {
      window.print();
    });
  }

  window.addEventListener('resize', postHeight);
  postHeight();
}());
</script>
