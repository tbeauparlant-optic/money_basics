<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8expenses-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8expenses-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8expenses-table-wrap{overflow-x:auto}
  .mb8expenses-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8expenses-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8expenses-table tbody th,.mb8expenses-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8expenses-table tbody tr:last-child th,.mb8expenses-table tbody tr:last-child td{border-bottom:none}
  .mb8expenses-input{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:2px solid #000000;border-radius:14px;background:transparent;color:rgb(0,0,0);font:inherit;line-height:1.2}
  .mb8expenses-input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8expenses-wrap{padding:6px}
  }
</style>

<div id="mb8expenses-root" class="mb8expenses-wrap">
  <h2 class="mb8expenses-title">Monthly Expenses and Due Dates</h2>
  <div class="mb8expenses-table-wrap">
    <table class="mb8expenses-table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Expense or bill</th>
          <th scope="col">Amount</th>
          <th scope="col">Due date or timing</th>
        </tr>
      </thead>
      <tbody id="mb8expenses-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb8expenses-root');
  var tbody = document.getElementById('mb8expenses-body');
  var rowCount = 8;

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8expenses',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  for (var i = 0; i < rowCount; i++) {
    var row = document.createElement('tr');
    var rowHead = document.createElement('th');
    rowHead.scope = 'row';
    rowHead.textContent = String(i + 1);
    row.appendChild(rowHead);

    for (var col = 0; col < 3; col++) {
      var td = document.createElement('td');
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'mb8expenses-input';
      input.addEventListener('input', postHeight);
      td.appendChild(input);
      row.appendChild(td);
    }

    tbody.appendChild(row);
  }

  window.addEventListener('resize', postHeight);
  postHeight();
}());
</script>
