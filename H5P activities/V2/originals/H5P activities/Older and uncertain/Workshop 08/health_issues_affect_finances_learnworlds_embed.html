<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8hiaf-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8hiaf-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8hiaf-table-wrap{overflow-x:auto}
  .mb8hiaf-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8hiaf-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8hiaf-table tbody th,.mb8hiaf-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8hiaf-table tbody tr:last-child th,.mb8hiaf-table tbody tr:last-child td{border-bottom:none}
  .mb8hiaf-table tbody th{font-weight:600;min-width:18rem}
  .mb8hiaf-choice{display:flex;align-items:center;justify-content:center;gap:6px;min-width:5.5rem}
  .mb8hiaf-choice span{font-size:.92rem}
  .mb8hiaf-choice input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8hiaf-wrap{padding:6px}
    .mb8hiaf-table tbody th{min-width:14rem}
    .mb8hiaf-choice{justify-content:flex-start;min-width:0}
  }
</style>

<div id="mb8hiaf-root" class="mb8hiaf-wrap">
  <h2 class="mb8hiaf-title">How Mental Health, Addiction, Treatment, and/or Physical Health Issues Affect My Finances</h2>
  <div class="mb8hiaf-table-wrap">
    <table class="mb8hiaf-table">
      <thead>
        <tr>
          <th scope="col">Statement</th>
          <th scope="col">Never</th>
          <th scope="col">Rarely</th>
          <th scope="col">Sometimes</th>
          <th scope="col">Often</th>
        </tr>
      </thead>
      <tbody id="mb8hiaf-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb8hiaf-root');
  var tbody = document.getElementById('mb8hiaf-body');
  var statements = [
    'Important bills don\'t get paid on time.',
    'I go on rampant spending sprees.',
    'I spend money I can\'t really afford on unnecessary things.',
    'I avoid opening my mail.',
    'I have a hard time writing and signing checks.',
    'I have a hard time using ATMs or debit card machines.',
    'I let my finances go unchecked.',
    'I can\'t physically access my finances.',
    'I lose important financial documents.',
    'I stop caring about keeping a budget and start making poor financial choices.',
    'I sabotage my own financial situation.'
  ];
  var options = ['Never', 'Rarely', 'Sometimes', 'Often'];

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8hiaf',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  statements.forEach(function (statement, rowIndex) {
    var row = document.createElement('tr');
    var rowHead = document.createElement('th');
    rowHead.scope = 'row';
    rowHead.textContent = statement;
    row.appendChild(rowHead);

    options.forEach(function (option) {
      var td = document.createElement('td');
      var label = document.createElement('label');
      var input = document.createElement('input');
      var span = document.createElement('span');

      label.className = 'mb8hiaf-choice';
      input.type = 'radio';
      input.name = 'mb8hiaf-' + rowIndex;
      input.value = option;
      input.addEventListener('change', postHeight);
      span.textContent = option;

      label.appendChild(input);
      label.appendChild(span);
      td.appendChild(label);
      row.appendChild(td);
    });

    tbody.appendChild(row);
  });

  window.addEventListener('resize', postHeight);
  postHeight();
}());
</script>
