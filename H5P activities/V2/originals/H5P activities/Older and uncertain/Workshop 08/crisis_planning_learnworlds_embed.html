<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8crisis-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8crisis-title{margin:0 0 16px;font-size:1.2em;line-height:1.2}
  .mb8crisis-worksheet{margin:0 0 22px}
  .mb8crisis-worksheet-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8crisis-table-wrap{overflow-x:auto}
  .mb8crisis-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8crisis-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8crisis-table tbody th,.mb8crisis-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8crisis-table tbody tr:last-child th,.mb8crisis-table tbody tr:last-child td{border-bottom:none}
  .mb8crisis-table tbody th{font-weight:600}
  .mb8crisis-table--scale tbody th{min-width:18rem}
  .mb8crisis-choice{display:flex;align-items:center;justify-content:center;gap:6px;min-width:5.5rem}
  .mb8crisis-choice span{font-size:.92rem}
  .mb8crisis-field{display:grid;gap:8px;margin-top:12px}
  .mb8crisis-label{display:block;font-weight:700;color:#35525a}
  .mb8crisis-input,.mb8crisis-textarea{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border:2px solid #000000;border-radius:14px;background:transparent;color:rgb(0,0,0);font:inherit;line-height:1.2}
  .mb8crisis-textarea{min-height:88px;resize:vertical}
  .mb8crisis-input:focus-visible,.mb8crisis-textarea:focus-visible,.mb8crisis-choice input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8crisis-wrap{padding:6px}
    .mb8crisis-table--scale tbody th{min-width:14rem}
    .mb8crisis-choice{justify-content:flex-start;min-width:0}
  }
</style>

<div id="mb8crisis-root" class="mb8crisis-wrap"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'workshop-08-crisis-planning-html-v1';
  var config = {
    title: 'Financial Crisis Planning',
    scaleLabels: {
      option1: 'Never',
      option2: 'Rarely',
      option3: 'Sometimes',
      option4: 'Often'
    },
    financialWorksheet: {
      heading: 'How Financial Issues Affect Me',
      statementColumnLabel: 'Statement',
      statementsText: "I experience anxiety.\nMy sleep is interrupted.\nI feel hopeless.\nI can't purchase needed medication or access services.\nI can't buy the things I want.\nI do without necessities.\nI feel ashamed.\nI worry about my future.\nMy relationship with my partner is strained.\nI dread (or avoid) opening mail or answering the phone.\nI feel out of control with my spending.\nI have to work more than I would like just to pay my bills.\nI can't go out with my friends or take a vacation.\nI feel powerless over my finances."
    },
    healthWorksheet: {
      heading: 'How Mental Health, Addiction, Treatment, and/or Physical Health Issues Affect My Finances',
      statementColumnLabel: 'Statement',
      statementsText: "Important bills don't get paid on time.\nI go on rampant spending sprees.\nI spend money I can't really afford on unnecessary things.\nI avoid opening my mail.\nI have a hard time writing and signing checks.\nI have a hard time using ATMs or debit card machines.\nI let my finances go unchecked.\nI can't physically access my finances.\nI lose important financial documents.\nI stop caring about keeping a budget and start making poor financial choices.\nI sabotage my own financial situation."
    },
    whenExperienceWorksheet: {
      heading: 'When I do or experience this, I will do this instead',
      numberHeader: '#',
      triggerHeader: 'What happens',
      alternativeHeader: 'What I will do instead'
    },
    ratherThanWorksheet: {
      heading: 'Rather than doing this, I will do this instead',
      numberHeader: '#',
      triggerHeader: 'What happens',
      alternativeHeader: 'What I will do instead'
    },
    replacementRowCount: 5,
    expensesWorksheet: {
      heading: 'Monthly Expenses and Due Dates',
      numberHeader: '#',
      expenseHeader: 'Expense or bill',
      amountHeader: 'Amount',
      dueHeader: 'Due date or timing'
    },
    expenseRowCount: 8,
    supportWorksheet: {
      heading: 'Trusted Support Person',
      nameLabel: 'Trusted person',
      relationshipLabel: 'Relationship to me',
      contactLabel: 'Best way to contact them',
      helpLabel: 'How this person can help me during a financial crisis',
      payeeRightsLabel: 'Representative payee rights, questions, or reminders'
    }
  };

  var root = document.getElementById('mb8crisis-root');

  function loadState() {
    try {
      return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || '{}');
    } catch (error) {
      return {};
    }
  }

  function saveState(state) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
    }
  }

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8crisis',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  function lines(text) {
    return String(text || '')
      .split(/\r?\n/)
      .map(function (line) { return line.trim(); })
      .filter(Boolean);
  }

  function scaleOptions() {
    return [
      config.scaleLabels.option1,
      config.scaleLabels.option2,
      config.scaleLabels.option3,
      config.scaleLabels.option4
    ].filter(Boolean);
  }

  var state = loadState();

  function bindValue(element, key, fallback) {
    element.value = state[key] || fallback || '';
    element.addEventListener('input', function () {
      state[key] = element.value;
      saveState(state);
      postHeight();
    });
  }

  function create(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (typeof text === 'string') node.textContent = text;
    return node;
  }

  function addWorksheet(titleText) {
    var section = create('section', 'mb8crisis-worksheet');
    section.appendChild(create('h3', 'mb8crisis-worksheet-title', titleText));
    root.appendChild(section);
    return section;
  }

  function buildScaleTable(cfg, stateKey) {
    var section = addWorksheet(cfg.heading);
    var wrap = create('div', 'mb8crisis-table-wrap');
    var table = create('table', 'mb8crisis-table mb8crisis-table--scale');
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    var tbody = document.createElement('tbody');
    var savedValues = state[stateKey] || [];

    headRow.appendChild(create('th', '', cfg.statementColumnLabel));
    scaleOptions().forEach(function (option) {
      headRow.appendChild(create('th', '', option));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    lines(cfg.statementsText).forEach(function (statement, index) {
      var row = document.createElement('tr');
      var rowHead = create('th', '', statement);
      rowHead.scope = 'row';
      row.appendChild(rowHead);

      scaleOptions().forEach(function (option) {
        var td = document.createElement('td');
        var label = create('label', 'mb8crisis-choice');
        var input = document.createElement('input');
        var span = document.createElement('span');

        input.type = 'radio';
        input.name = stateKey + '-' + index;
        input.value = option;
        input.checked = savedValues[index] === option;
        input.addEventListener('change', function () {
          if (!state[stateKey]) state[stateKey] = [];
          state[stateKey][index] = option;
          saveState(state);
          postHeight();
        });

        span.textContent = option;
        label.appendChild(input);
        label.appendChild(span);
        td.appendChild(label);
        row.appendChild(td);
      });

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
    section.appendChild(wrap);
  }

  function buildReplacementTable(cfg, stateKey, rowCount) {
    var section = addWorksheet(cfg.heading);
    var wrap = create('div', 'mb8crisis-table-wrap');
    var table = create('table', 'mb8crisis-table');
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    var tbody = document.createElement('tbody');
    var savedRows = state[stateKey] || [];

    [cfg.numberHeader, cfg.triggerHeader, cfg.alternativeHeader].forEach(function (text) {
      headRow.appendChild(create('th', '', text));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    for (var i = 0; i < rowCount; i++) {
      var row = document.createElement('tr');
      var rowHead = create('th', '', String(i + 1));
      rowHead.scope = 'row';
      row.appendChild(rowHead);

      ['trigger', 'alternative'].forEach(function (field) {
        var td = document.createElement('td');
        var textarea = create('textarea', 'mb8crisis-textarea');
        textarea.rows = 3;
        bindValue(textarea, stateKey + '-' + i + '-' + field, (savedRows[i] || {})[field] || '');
        textarea.addEventListener('input', function (rowIndex, key, element) {
          return function () {
            if (!state[stateKey]) state[stateKey] = [];
            if (!state[stateKey][rowIndex]) state[stateKey][rowIndex] = {};
            state[stateKey][rowIndex][key] = element.value;
            saveState(state);
          };
        }(i, field, textarea));
        td.appendChild(textarea);
        row.appendChild(td);
      });

      tbody.appendChild(row);
    }

    table.appendChild(tbody);
    wrap.appendChild(table);
    section.appendChild(wrap);
  }

  function buildExpenseTable(cfg, rowCount) {
    var section = addWorksheet(cfg.heading);
    var wrap = create('div', 'mb8crisis-table-wrap');
    var table = create('table', 'mb8crisis-table');
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    var tbody = document.createElement('tbody');
    var savedRows = state.expenseRows || [];

    [cfg.numberHeader, cfg.expenseHeader, cfg.amountHeader, cfg.dueHeader].forEach(function (text) {
      headRow.appendChild(create('th', '', text));
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    for (var i = 0; i < rowCount; i++) {
      var row = document.createElement('tr');
      var rowHead = create('th', '', String(i + 1));
      rowHead.scope = 'row';
      row.appendChild(rowHead);

      ['expense', 'amount', 'due'].forEach(function (field) {
        var td = document.createElement('td');
        var input = create('input', 'mb8crisis-input');
        input.type = 'text';
        bindValue(input, 'expenseRows-' + i + '-' + field, (savedRows[i] || {})[field] || '');
        input.addEventListener('input', function (rowIndex, key, element) {
          return function () {
            if (!state.expenseRows) state.expenseRows = [];
            if (!state.expenseRows[rowIndex]) state.expenseRows[rowIndex] = {};
            state.expenseRows[rowIndex][key] = element.value;
            saveState(state);
          };
        }(i, field, input));
        td.appendChild(input);
        row.appendChild(td);
      });

      tbody.appendChild(row);
    }

    table.appendChild(tbody);
    wrap.appendChild(table);
    section.appendChild(wrap);
  }

  function buildSupportFields(cfg) {
    var section = addWorksheet(cfg.heading);

    [
      { key: 'supportName', label: cfg.nameLabel, multiline: false },
      { key: 'supportRelationship', label: cfg.relationshipLabel, multiline: false },
      { key: 'supportContact', label: cfg.contactLabel, multiline: false },
      { key: 'supportHelp', label: cfg.helpLabel, multiline: true },
      { key: 'payeeRights', label: cfg.payeeRightsLabel, multiline: true }
    ].forEach(function (field) {
      var wrapper = create('div', 'mb8crisis-field');
      var label = create('label', 'mb8crisis-label', field.label);
      var input = create(field.multiline ? 'textarea' : 'input', field.multiline ? 'mb8crisis-textarea' : 'mb8crisis-input');

      if (!field.multiline) input.type = 'text';
      bindValue(input, field.key, state[field.key] || '');
      wrapper.appendChild(label);
      wrapper.appendChild(input);
      section.appendChild(wrapper);
    });
  }

  root.appendChild(create('h2', 'mb8crisis-title', config.title));
  buildScaleTable(config.financialWorksheet, 'financialEffects');
  buildScaleTable(config.healthWorksheet, 'healthEffects');
  buildReplacementTable(config.whenExperienceWorksheet, 'whenExperienceRows', config.replacementRowCount);
  buildReplacementTable(config.ratherThanWorksheet, 'ratherThanRows', config.replacementRowCount);
  buildExpenseTable(config.expensesWorksheet, config.expenseRowCount);
  buildSupportFields(config.supportWorksheet);

  window.addEventListener('resize', postHeight);
  postHeight();
}());
</script>
