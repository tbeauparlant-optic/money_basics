<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8rather-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8rather-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8rather-table-wrap{overflow-x:auto}
  .mb8rather-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8rather-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8rather-table tbody th,.mb8rather-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8rather-table tbody tr:last-child th,.mb8rather-table tbody tr:last-child td{border-bottom:none}
  .mb8rather-textarea{display:block;width:100%;min-height:88px;box-sizing:border-box;padding:10px 12px;border:2px solid #000000;border-radius:14px;background:transparent;color:rgb(0,0,0);font:inherit;line-height:1.2;resize:vertical}
  .mb8rather-textarea:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8rather-wrap{padding:6px}
  }
</style>

<div id="mb8rather-root" class="mb8rather-wrap">
  <h2 class="mb8rather-title">Rather than doing this, I will do this instead</h2>
  <div class="mb8rather-table-wrap">
    <table class="mb8rather-table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">What happens</th>
          <th scope="col">What I will do instead</th>
        </tr>
      </thead>
      <tbody id="mb8rather-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb8rather-root');
  var tbody = document.getElementById('mb8rather-body');
  var rowCount = 5;

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8rather',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  for (var i = 0; i < rowCount; i++) {
    var row = document.createElement('tr');
    var rowHead = document.createElement('th');
    rowHead.scope = 'row';
    rowHead.textContent = String(i + 1);
    row.appendChild(rowHead);

    for (var col = 0; col < 2; col++) {
      var td = document.createElement('td');
      var textarea = document.createElement('textarea');
      textarea.className = 'mb8rather-textarea';
      textarea.rows = 3;
      textarea.addEventListener('input', postHeight);
      td.appendChild(textarea);
      row.appendChild(td);
    }

    tbody.appendChild(row);
  }

  window.addEventListener('resize', postHeight);
  postHeight();
}());
</script>
