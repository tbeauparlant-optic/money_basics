<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8when-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8when-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8module-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .mb8module-tool{padding:9px 14px;border:1px solid #094725;border-radius:999px;background:#094725;color:#ffffff;font:inherit;font-weight:700;line-height:1.1;cursor:pointer}
  .mb8module-tool:hover{background:#0b5a2f}
  .mb8module-tool:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  .mb8when-table-wrap{overflow-x:auto}
  .mb8when-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8when-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8when-table tbody th,.mb8when-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8when-table tbody tr:last-child th,.mb8when-table tbody tr:last-child td{border-bottom:none}
  .mb8when-textarea{display:block;width:100%;min-height:88px;box-sizing:border-box;padding:10px 12px;border:2px solid #000000;border-radius:14px;background:transparent;color:rgb(0,0,0);font:inherit;line-height:1.2;resize:vertical}
  .mb8when-textarea:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8when-wrap{padding:6px}
  }
  @media print{.mb8module-tools{display:none}}
</style>

<div id="mb8when-root" class="mb8when-wrap">
  <h2 class="mb8when-title">When I do or experience this, I will do this instead</h2>
  <div class="mb8module-tools" aria-label="Activity tools">
    <button class="mb8module-tool" type="button" data-mb8-download>Download</button>
    <button class="mb8module-tool" type="button" data-mb8-print>Print</button>
  </div>
  <div class="mb8when-table-wrap">
    <table class="mb8when-table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">What happens</th>
          <th scope="col">What I will do instead</th>
        </tr>
      </thead>
      <tbody id="mb8when-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb8when-root');
  var tbody = document.getElementById('mb8when-body');
  var rowCount = 5;

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8when',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  for (var i = 0; i < rowCount; i++) {
    var row = document.createElement('tr');
    var rowHead = document.createElement('th');
    rowHead.scope = 'row';
    rowHead.textContent = String(i + 1);
    row.appendChild(rowHead);

    for (var col = 0; col < 2; col++) {
      var td = document.createElement('td');
      var textarea = document.createElement('textarea');
      textarea.className = 'mb8when-textarea';
      textarea.rows = 3;
      textarea.addEventListener('input', postHeight);
      td.appendChild(textarea);
      row.appendChild(td);
    }

    tbody.appendChild(row);
  }

  window.addEventListener('resize', postHeight);
  addTools(root, 'when-i-do-or-experience-this.txt');
  postHeight();

  function addTools(container, filename) {
    var download = container ? container.querySelector('[data-mb8-download]') : null;
    var print = container ? container.querySelector('[data-mb8-print]') : null;
    if (download) download.addEventListener('click', function () { downloadText(filename, collectResponses(container)); });
    if (print) print.addEventListener('click', function () { window.print(); });
  }

  function collectResponses(container) {
    var headings = Array.prototype.map.call(container.querySelectorAll('thead th'), function (th) { return th.textContent; });
    var lines = [container.querySelector('h2').textContent, '', headings.slice(1).join('\t')];
    Array.prototype.forEach.call(container.querySelectorAll('tbody tr'), function (row) {
      var values = Array.prototype.map.call(row.querySelectorAll('textarea'), function (field) { return field.value.replace(/\r?\n/g, ' '); });
      lines.push(values.join('\t'));
    });
    return lines.join('\n');
  }

  function downloadText(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
}());
</script>
