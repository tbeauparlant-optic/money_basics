<!-- Paste this whole block into the LearnWorlds embedded script widget -->
<style>
  .mb8fiam-wrap{max-width:1100px;margin:0 auto;padding:8px;font-family:"INTER_18PT-REGULAR","Inter",Arial,sans-serif;font-size:16px;line-height:1.5;color:rgb(0,0,0)}
  .mb8fiam-title{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #d8e1de;color:#35525a;font-size:1.05em;line-height:1.25}
  .mb8module-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .mb8module-tool{padding:9px 14px;border:1px solid #094725;border-radius:999px;background:#094725;color:#ffffff;font:inherit;font-weight:700;line-height:1.1;cursor:pointer}
  .mb8module-tool:hover{background:#0b5a2f}
  .mb8module-tool:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  .mb8fiam-table-wrap{overflow-x:auto}
  .mb8fiam-table{width:100%;border-collapse:separate;border-spacing:0}
  .mb8fiam-table thead th{background:#eef4fb;border-bottom:1px solid #d8e1de;color:#243b53;font-weight:700;padding:10px;text-align:left}
  .mb8fiam-table tbody th,.mb8fiam-table tbody td{border-bottom:1px solid #e6edf3;padding:10px;text-align:left;vertical-align:top}
  .mb8fiam-table tbody tr:last-child th,.mb8fiam-table tbody tr:last-child td{border-bottom:none}
  .mb8fiam-table tbody th{font-weight:600;min-width:18rem}
  .mb8fiam-choice{display:flex;align-items:center;justify-content:center;gap:6px;min-width:5.5rem}
  .mb8fiam-choice span{font-size:.92rem}
  .mb8fiam-choice input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
  @media (max-width:720px){
    .mb8fiam-wrap{padding:6px}
    .mb8fiam-table tbody th{min-width:14rem}
    .mb8fiam-choice{justify-content:flex-start;min-width:0}
  }
  @media print{.mb8module-tools{display:none}}
</style>

<div id="mb8fiam-root" class="mb8fiam-wrap">
  <h2 class="mb8fiam-title">How Financial Issues Affect Me</h2>
  <div class="mb8module-tools" aria-label="Activity tools">
    <button class="mb8module-tool" type="button" data-mb8-download>Download</button>
    <button class="mb8module-tool" type="button" data-mb8-print>Print</button>
  </div>
  <div class="mb8fiam-table-wrap">
    <table class="mb8fiam-table">
      <thead>
        <tr>
          <th scope="col">Statement</th>
          <th scope="col">Never</th>
          <th scope="col">Rarely</th>
          <th scope="col">Sometimes</th>
          <th scope="col">Often</th>
        </tr>
      </thead>
      <tbody id="mb8fiam-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('mb8fiam-root');
  var tbody = document.getElementById('mb8fiam-body');
  var statements = [
    'I experience anxiety.',
    'My sleep is interrupted.',
    'I feel hopeless.',
    'I can\'t purchase needed medication or access services.',
    'I can\'t buy the things I want.',
    'I do without necessities.',
    'I feel ashamed.',
    'I worry about my future.',
    'My relationship with my partner is strained.',
    'I dread (or avoid) opening mail or answering the phone.',
    'I feel out of control with my spending.',
    'I have to work more than I would like just to pay my bills.',
    'I can\'t go out with my friends or take a vacation.',
    'I feel powerless over my finances.'
  ];
  var options = ['Never', 'Rarely', 'Sometimes', 'Often'];

  function postHeight() {
    if (!root) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: 'mb8fiam',
        type: 'resize',
        height: Math.ceil(root.getBoundingClientRect().height)
      }, '*');
    }
  }

  statements.forEach(function (statement, rowIndex) {
    var row = document.createElement('tr');
    var rowHead = document.createElement('th');
    rowHead.scope = 'row';
    rowHead.textContent = statement;
    row.appendChild(rowHead);

    options.forEach(function (option) {
      var td = document.createElement('td');
      var label = document.createElement('label');
      var input = document.createElement('input');
      var span = document.createElement('span');

      label.className = 'mb8fiam-choice';
      input.type = 'radio';
      input.name = 'mb8fiam-' + rowIndex;
      input.value = option;
      input.addEventListener('change', postHeight);
      span.textContent = option;

      label.appendChild(input);
      label.appendChild(span);
      td.appendChild(label);
      row.appendChild(td);
    });

    tbody.appendChild(row);
  });

  window.addEventListener('resize', postHeight);
  addTools(root, 'financial-issues-affect-me.txt');
  postHeight();

  function addTools(container, filename) {
    var download = container ? container.querySelector('[data-mb8-download]') : null;
    var print = container ? container.querySelector('[data-mb8-print]') : null;
    if (download) download.addEventListener('click', function () { downloadText(filename, collectResponses(container)); });
    if (print) print.addEventListener('click', function () { window.print(); });
  }

  function collectResponses(container) {
    var lines = [container.querySelector('h2').textContent, ''];
    Array.prototype.forEach.call(container.querySelectorAll('tbody tr'), function (row) {
      var statement = row.querySelector('th').textContent;
      var checked = row.querySelector('input:checked');
      lines.push(statement + ': ' + (checked ? checked.value : ''));
    });
    return lines.join('\n');
  }

  function downloadText(filename, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
}());
</script>
