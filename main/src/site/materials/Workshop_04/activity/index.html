  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Interactive Check Explainer</title>
      <link rel="stylesheet" href="../../_assets/materials.css" />
      <style>
        :root {
          --hotspot-size: 46px;
        }

        body {
          max-width: 1100px;
          margin: 0 auto;
          padding: 18px;
        }

        .wrap {
          display: grid;
          gap: 14px;
        }

        .topbar {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
          justify-content: space-between;
        }

        .topbar nav {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          align-items: center;
        }

        .btn {
          display: inline-block;
          padding: 10px 14px;
          border-radius: 10px;
          border: 1px solid rgba(0,0,0,0.25);
          text-decoration: none;
          background: white;
          color: inherit;
        }

        .btn:hover {
          filter: brightness(0.98);
        }

        .card {
          background: white;
          border: 1px solid rgba(0,0,0,0.18);
          border-radius: 14px;
          padding: 14px;
          box-shadow: 0 6px 24px rgba(0,0,0,0.06);
        }

        .hint {
          margin: 0;
          opacity: 0.85;
        }

        .stage {
          position: relative;
          width: 100%;
          max-width: 1100px;
          margin: 0 auto;
          border-radius: 14px;
          overflow: hidden;
          border: 1px solid rgba(0,0,0,0.18);
          background: #fff;
        }

        .stage img {
          display: block;
          width: 100%;
          height: auto;
        }

        .hotspot {
          position: absolute;
          width: var(--hotspot-size);
          height: var(--hotspot-size);
          border-radius: 999px;
          transform: translate(-50%, -50%);
          border: 2px solid rgba(0,0,0,0.75);
          background: rgba(255,255,255,0.90);
          display: grid;
          place-items: center;
          cursor: pointer;
          user-select: none;
        }

        .hotspot:focus {
          outline: 3px solid rgba(0, 95, 204, 0.9);
          outline-offset: 2px;
        }

        .hotspot span {
          font-weight: 800;
          font-size: 16px;
          line-height: 1;
        }

        /* Modal */
        .modal-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.55);
          display: none;
          align-items: center;
          justify-content: center;
          padding: 18px;
          z-index: 9999;
        }

        .modal {
          width: min(720px, 100%);
          background: #fff;
          border-radius: 16px;
          border: 1px solid rgba(0,0,0,0.2);
          box-shadow: 0 16px 60px rgba(0,0,0,0.25);
          overflow: hidden;
        }

        .modal header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 16px;
          border-bottom: 1px solid rgba(0,0,0,0.12);
        }

        .modal header h2 {
          margin: 0;
          font-size: 18px;
        }

        .modal .body {
          padding: 16px;
        }

        .modal .body p {
          margin-top: 0;
          margin-bottom: 0;
          line-height: 1.5;
        }

        .close {
          border: 1px solid rgba(0,0,0,0.25);
          background: white;
          border-radius: 10px;
          padding: 8px 10px;
          cursor: pointer;
        }
      </style>
    </head>

    <body>
      <div class="wrap">
        <div class="topbar">
          <div>
            <h1 style="margin:0;">Interactive Check Explainer</h1>
            <p class="hint" style="margin-top:6px;">
              Click a number on the check to learn what it means.
            </p>
          </div>

          <nav>
            <a class="btn" href="../../index.html">Home</a>
            <a class="btn" href="../index.html">Back to Workshop 4</a>
          </nav>
        </div>

        <div class="card">
          <p class="hint">
            Tip: You can also use the <strong>Tab</strong> key to move through numbers, then press <strong>Enter</strong>.
          </p>
        </div>

        <div class="stage" id="stage">
          <img
            src="../../_assets/images/check-how-to-read.png"
            alt="A sample check with numbered callouts."
          />
          <!-- Hotspots injected by JS -->
        </div>
      </div>

      <!-- Modal -->
      <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
          <header>
            <h2 id="modalTitle">Item</h2>
            <button class="close" id="closeBtn" type="button" aria-label="Close">Close</button>
          </header>
          <div class="body">
            <p id="modalText"></p>
          </div>
        </div>
      </div>

      <script>
        /**
        * Hotspot positions are based on the cropped check image produced from pg11_12.pdf.
        * Positions are percentages of the image dimensions.
        */
        const HOTSPOTS = [
          { num: 1, xPct: 29.6974, yPct: 21.168 },
          { num: 2, xPct: 70.8976, yPct: 25.8188 },
          { num: 3, xPct: 80.8976, yPct: 16.2255 },
          { num: 4, xPct: 18.4974, yPct: 34.4319 },
          { num: 5, xPct: 86.8977, yPct: 41.8378 },
          { num: 6, xPct: 20.0974, yPct: 47.8663 },
          { num: 7, xPct: 16.9573, yPct: 56.9072 },
          { num: 8, xPct: 80.0976, yPct: 57.3604 },
          { num: 9, xPct: 28.0974, yPct: 77.1646 },
          { num: 10, xPct: 46.0975, yPct: 77.9025 },
          { num: 11, xPct: 86.4977, yPct: 34.3397 },
          { num: 12, xPct: 52.0975, yPct: 34.3888 },
        ];

        /**
        * Explanations (you can edit text freely later without touching coordinates).
        * Kept simple + practical; no repo restructuring required.
        */
        const EXPLAIN = {
          1: {
            title: "1. Address Field",
            text: "Account holder's name, address, phone number, and email address can appear in this section of the check, called the Address Field."
          },
          2: {
            title: "2. Bank Information",
            text: "The bank name, city and state of the processing facility, or the city and state of the account holder's branch; the bank's phone number; the bank's website address and/or the bank's email address may appear in this section. This section can also be located above field 7 (the memo field)."
          },
          3: {
            title: "3. Check Number",
            text: "The check number appears at the top right, shown here as 101."
          },
          4: {
            title: "4. Pay to the Order of",
            text: "Pay to the order of. This section should have the name of the person or company that is being paid (the name of the party receiving the check)."
          },
          5: {
            title: "5. Amount (Numbers)",
            text: "The amount written numerically. If this check were for one hundred dollars, within the box labeled \"5\" in the example above, it should read, \"$100.00.\""
          },
          6: {
            title: "6. Amount (Words)",
            text: "The amount written in words. If this check were for $100, in the blank section labeled \"6,\" you would write, \"One Hundred and 00/100.\" Many people will then draw a line to the preprinted \"Dollars\" to discourage alteration. If the check were for $101.59, it would be written, \"One Hundred One and 59/100.\""
          },
          7: {
            title: "7. Memo / For",
            text: "The \"For\" or \"Memo\" section can be left blank, or you can enter any information about the payment. Some people note an account number or invoice number that is being paid with the check, others may just write, \"For Birthday\" or another note to remind them what the check was for. This field is not read by the bank and does not change how the check is processed."
          },
          8: {
            title: "8. Payer Signature",
            text: "The signature line. This is where the account holder would sign the check. On a check draft, the signature is not required, although it is common to have a signature disclaimer in this section."
          },
          9: {
            title: "9. Routing Number",
            text: "This MICR field is the routing number. This is the 9 digit code that routes the check to the issuing bank. The routing number should match the bank name and the fraction code. This number is needed when providing direct deposit information to an employer."
          },
          10: {
            title: "10. Account Number",
            text: "This is an MICR field that lists the account holder's account number at the bank. This number is also needed when providing direct deposit information to an employer."
          },
          11: {
            title: "11. Fraction Code",
            text: "Fraction Code. This field is the fraction that denotes the routing for the check. The fraction code is another way to write the 9-digit routing number. If the MICR line on the check is mutilated, the fraction code will be used in its place."
          },
          12: {
            title: "12. Date Field",
            text: "The date field. Fill this in with the date the check is created"
          }
        };

        const stage = document.getElementById("stage");
        const backdrop = document.getElementById("backdrop");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const closeBtn = document.getElementById("closeBtn");

        function openModal(n) {
          const info = EXPLAIN[n] || { title: `Item ${n}`, text: "" };
          modalTitle.textContent = info.title;
          modalText.textContent = info.text;
          backdrop.style.display = "flex";
          closeBtn.focus();
        }

        function closeModal() {
          backdrop.style.display = "none";
        }

        function buildHotspots() {
          HOTSPOTS.forEach(h => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "hotspot";
            btn.style.left = `${h.xPct}%`;
            btn.style.top = `${h.yPct}%`;
            btn.setAttribute("aria-label", `Open explanation for number ${h.num}`);
            btn.innerHTML = `<span>${h.num}</span>`;
            btn.addEventListener("click", () => openModal(h.num));
            stage.appendChild(btn);
          });
        }

        // Close interactions
        closeBtn.addEventListener("click", closeModal);
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeModal();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && backdrop.style.display === "flex") closeModal();
        });

        buildHotspots();
      </script>
    </body>
  </html>
